location /api {
  rewrite ^/api/v9(.*) /v9$1 break; # Requests it matches are rewritten and stop here
  rewrite ^/api(.*) /v1$1 break; # Every other request is rewritten here
  proxy_pass http://127.0.0.1:8080/;
}

# Request received by nginx: /api../secret
# Request received by backend: /v1../secret

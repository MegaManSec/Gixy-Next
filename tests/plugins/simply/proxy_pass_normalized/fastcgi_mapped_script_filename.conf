map $request_method $script {
  default $uri; # The rewritten $uri, evaluated when the request to the backend is built
}

location /api {
  rewrite ^/api(.*) /$1 break;
  fastcgi_param SCRIPT_FILENAME /srv$script;
  fastcgi_pass 127.0.0.1:9000;
}

# Request received by nginx: /api../x
# SCRIPT_FILENAME sent to the backend: /srv/../x

http {
    server {
        listen 443 ssl default_server;
        server_name example.com;
        http2 on;
        ssl_certificate     /etc/ssl/example.com.crt;
        ssl_certificate_key /etc/ssl/example.com.key;
        location / {
            proxy_pass http://backend;
        }
    }
    server {
        listen 443 ssl;
        http2 on;
        ssl_reject_handshake on;
    }
}

# False positive in the original plugin: the standalone `break;`
# directive emits `ngx_http_script_break_code`, which also writes
# `e->ip = ngx_http_script_exit`. The `set` after it never runs.
server {
    location / {
        rewrite ^(.*) /new?c=1;
        break;
        set $myvar $1;
    }
}

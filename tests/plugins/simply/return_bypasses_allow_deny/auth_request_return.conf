# Should TRIGGER: auth_request runs in the access phase, after the return.
# Verified against nginx: a client the auth endpoint rejects receives 200.
server {
  location /admin/ {
    auth_request /auth;
    return 200 "secret";
  }

  location = /auth {
    internal;
    proxy_pass http://127.0.0.1:9000;
  }
}

name: Check release

on:
  workflow_call:

jobs:
  check:
    name: Check release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-tags: true
          persist-credentials: false

      - name: Match the release to the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' gixy/__init__.py)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match gixy/__init__.py version $version."
            exit 1
          fi
          if [ "$PRERELEASE" = true ] || ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is a prerelease; only X.Y.Z releases are published."
            exit 1
          fi
          previous=$(git tag --list 'v*' --sort=-v:refname | awk -v tag="$TAG" '$0 != tag && !p { p = $0 } END { print p }')
          if [ -n "$previous" ]; then
            IFS=. read -r major minor patch <<< "${previous#v}"
            allowed="$major.$minor.$((patch + 1)) $major.$((minor + 1)).0 $((major + 1)).0.0"
            if [[ " $allowed " != *" $version "* ]]; then
              echo "::error::$version does not follow $previous; expected one of: $allowed."
              exit 1
            fi
          fi

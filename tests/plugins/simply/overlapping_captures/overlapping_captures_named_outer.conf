# Edge case: the outer capture is *named* but the replacement still
# references both captures by `$N`. PCRE numbers named captures alongside
# unnamed ones, so $1 = outer (named) and $2 = inner (unnamed) — their
# byte ranges still overlap and the bug still fires. The original PR's
# "nested *unnamed*" check missed this.
server {
    location / {
        rewrite ^/(?<outer>(.*))$ http://example.com/$1$2 redirect;
    }
}

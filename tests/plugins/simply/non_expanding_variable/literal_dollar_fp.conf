http {
    map $request_uri $is_admin {
        "~^/admin$" 1;
        default 0;
    }
    map $request_method $is_post {
        POST 1;
        default "";
    }
    geo $price {
        default "$5";
    }
    server {
        location ~ ^/price\$5 {
            return 404;
        }
        location ~ "^/a[$]b" {
            return 404;
        }
        location ~ ^/(old|legacy)$ {
            return 410;
        }
        location = /exact {
            return 204;
        }
        location @fallback {
            return 404;
        }
        location $is_post {
            return 405;
        }
        location / {
            if ($uri ~ ^/a$|^/b$) {
                return 404;
            }
            rewrite ^/(.*)$ /index.php?q=$1 last;
            auth_request off;
        }
        error_log /var/log/nginx/error.log;
    }
}

# Should NOT trigger: the converse case. `allow 0.0.0.0/0` only fills the
# IPv4 rule list, and `listen [::]:80` accepts IPv6 only because ipv6only
# defaults to on. Verified against nginx: an IPv6 client still gets 401 from
# auth_basic.
server {
    listen [::]:80;

    location /status {
        stub_status;
        satisfy any;
        allow 0.0.0.0/0;
        auth_basic "metrics";
        auth_basic_user_file /etc/nginx/htpasswd;
    }
}

# False positive in the original PR: the regex has two pairs of nested
# captures, but the replacement references $1 (outer of first pair) and
# $3 (outer of second pair). $1 and $3 are syntactic siblings — their
# match ranges cover different halves of the URI and never overlap, so
# the buggy escape(URI) budget is exactly right and there is no
# overflow. The original "any nested-unnamed pair exists somewhere"
# check flagged this; the precise referenced-captures-overlap check
# does not.
server {
    location / {
        rewrite ^/((.*))/((.*))$ http://example.com/$1$3 redirect;
    }
}

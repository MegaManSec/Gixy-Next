location /b {
  if ($arg_x) {
    rewrite ^ $request_uri;              # Only runs when the condition matches
  }
  rewrite ^ $request_uri;                # Always runs, so $1 is always raw
  rewrite ^/b/(.*)$ /$1 break;           # strip the prefix, stop rewriting
  proxy_pass http://127.0.0.1:8000/$1;
}

# Request received by nginx: /b/%2F
# Request received by backend: /%2F

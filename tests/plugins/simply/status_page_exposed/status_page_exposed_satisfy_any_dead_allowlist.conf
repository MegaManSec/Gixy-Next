# Should TRIGGER: the allowlist and the `deny all` both sit behind an
# `allow all`, so under `satisfy any` every client is let through before
# auth_basic runs. Verified against nginx: 200 without credentials.
location /status {
    satisfy any;
    allow 10.0.0.0/8;
    allow all;
    deny all;
    auth_basic "x";
    auth_basic_user_file /etc/nginx/htpasswd;
    stub_status;
}

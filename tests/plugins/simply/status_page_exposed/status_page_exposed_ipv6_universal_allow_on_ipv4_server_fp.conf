# Should NOT trigger: `allow ::/0` only fills the IPv6 rule list
# (ngx_http_access_rule), and `listen 80` binds the AF_INET wildcard only, so
# no client this server can accept is covered by it. Verified against nginx:
# an IPv4 client still gets 401 from auth_basic.
server {
    listen 80;

    location /status {
        stub_status;
        satisfy any;
        allow ::/0;
        auth_basic "metrics";
        auth_basic_user_file /etc/nginx/htpasswd;
    }
}

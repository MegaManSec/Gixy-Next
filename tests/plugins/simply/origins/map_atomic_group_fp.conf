# map-based CORS allowlists reach the same analysis from post_audit(); the
# atomic group is read like a non-capturing group, the host is pinned and
# nothing is reported.
http {
    map $http_origin $allow_origin {
        default "";
        ~^https://(?>www\.)example\.com$ $http_origin;
    }

    server {
        location / {
            add_header Access-Control-Allow-Origin $allow_origin;
        }
    }
}

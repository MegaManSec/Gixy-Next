# False positive guard: the `last` rewrite in the `if` either stops
# processing or fails and clears the captures, and the first rewrite
# defines no `$2`.
server {
    location /t/ {
        rewrite ^/t/(.*)$ /n/$1?c=1;
        if ($request_method = GET) {
            rewrite ^/n/([^/]*)/(.*)$ /m/x last;
        }
        set $myvar $2;
    }
}

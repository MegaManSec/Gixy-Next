# Should trigger: the map value is a full URL whose host is an upstream with a hostname server and no 'resolve'
http {
  map $arg_x $u {
    default https://app_a;
  }

  upstream app_a {
    server api.example.com:443;
  }

  server {
    listen 80;
    location / {
      proxy_pass $u;
    }
  }
}

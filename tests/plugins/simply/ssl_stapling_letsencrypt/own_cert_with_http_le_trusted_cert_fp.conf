http {
    ssl_stapling on;
    ssl_trusted_certificate /etc/letsencrypt/live/example.com/chain.pem;

    server {
        listen 443 ssl;
        server_name commercial.example.com;

        ssl_certificate     /etc/ssl/certs/commercial.example.com.pem;
        ssl_certificate_key /etc/ssl/private/commercial.example.com.key;
    }
}

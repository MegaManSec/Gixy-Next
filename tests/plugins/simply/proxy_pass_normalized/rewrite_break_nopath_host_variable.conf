location /api {
  set $backend 127.0.0.1:8080; # $backend cannot contain "/", so proxy_pass has no URI part
  rewrite ^/api(.*) /$1 break; # The replacement puts "/" before the capture, so the rewrite repeats the off-by-slash
  proxy_pass http://$backend;
}

# Request received by nginx: /api../secret
# Request received by backend: /../secret

# Should NOT trigger: a server with no `listen` gets the implicit AF_INET
# wildcard socket built by ngx_http_core_server(), so `allow ::/0` still
# covers nobody. Verified against nginx: an IPv4 client gets 401 and no IPv6
# socket is bound.
server {
    location /status {
        stub_status;
        satisfy any;
        allow ::/0;
        auth_basic "metrics";
        auth_basic_user_file /etc/nginx/htpasswd;
    }
}

# Should NOT trigger: the location declares an access rule of its own, so
# ngx_http_access_merge_loc_conf() does not inherit the server's `allow all`
# at all. Everyone outside the /8 falls through to auth_basic. Verified
# against nginx: 401 without credentials, 200 with them.
http {
    server {
        satisfy any;
        allow all;
        auth_basic "x";
        auth_basic_user_file /etc/nginx/htpasswd;

        location /status {
            allow 10.0.0.0/8;
            stub_status;
        }
    }
}

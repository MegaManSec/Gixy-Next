# Should NOT trigger: proxy_pass uses a bracketed IPv6 literal directly,
# with or without a port.
http {
  server {
    listen 80;
    location /a {
      proxy_pass http://[2001:db8::1]:8080;
    }
    location /b {
      proxy_pass http://[::1]:8080;
    }
    location /c {
      proxy_pass http://[2001:db8::1];
    }
  }
}

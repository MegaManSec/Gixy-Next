location /e/ {
  rewrite ^/e/old/(.*)$ /f/$1 last; # When it matches, the request leaves the location, so set never follows a continuing rewrite
  if ($uri ~ ^/e/(.*)$) {
    set $p $1; # set escapes the capture again
  }
  proxy_pass http://127.0.0.1:8080/$p;
}

# Request received by nginx: /e/a%3Fb
# Request received by backend: /a%3Fb

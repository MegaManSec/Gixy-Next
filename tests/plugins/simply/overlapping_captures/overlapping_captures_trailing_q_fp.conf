# False positive in the original PR: nginx strips a sole trailing `?`
# (its meaning is "drop the original arguments") before compiling the
# replacement — ngx_http_rewrite_module.c:343-346. With no `?` left and
# no redirect flag, neither e->quote nor e->is_args is ever set, so no
# capture is URI-escaped and no overflow can occur.
server {
    location / {
        rewrite ^/((.*))$ /internal/$1$2? last;
    }
}

http {
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }
    server {
        listen 80;
        server_name ~^(.+)\.proxy\.example\.com$;
        location / {
            if ($http_x_debug ~ "^1$") {
                return 403;
            }
            proxy_pass http://$1;
        }
    }
}

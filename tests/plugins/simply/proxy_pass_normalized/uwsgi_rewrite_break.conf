location /app {
  rewrite ^/app(.*) /$1 break; # The replacement puts "/" before the capture, so the rewrite repeats the off-by-slash
  uwsgi_pass 127.0.0.1:3031; # uwsgi_params sends the rewritten $document_uri as PATH_INFO
}

# Request received by nginx: /app../secret
# PATH_INFO sent to the backend: /../secret

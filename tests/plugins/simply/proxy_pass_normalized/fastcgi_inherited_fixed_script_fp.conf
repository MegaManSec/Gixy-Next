server {
  fastcgi_param SCRIPT_FILENAME /srv/index.php; # The location declares no fastcgi_param, so it inherits this one

  location /api {
    rewrite ^/api(.*) /$1 break;
    fastcgi_pass 127.0.0.1:9000;
  }
}

# Request received by nginx: /api../x
# SCRIPT_FILENAME sent to the backend: /srv/index.php

http {
    map $host $backend {
        default $host;
        api.example.com 10.0.0.5;
    }

    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 80;
        server_name example.com api.example.com;

        location / {
            proxy_pass http://$backend;
        }
    }
}

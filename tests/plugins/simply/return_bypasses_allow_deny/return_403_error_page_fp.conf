# Should NOT trigger: `return 403` produces the same response a denied client
# gets from `deny`, error_page included. Verified against nginx.
server {
  error_page 403 /403.html;

  location /admin/ {
    allow 127.0.0.1;
    deny all;
    if ($http_user_agent ~* bot) {
      return 403;
    }
    proxy_pass http://127.0.0.1:9000;
  }
}

http {
    map $http_origin $cors {
        "~^https://trusted\.example$" $http_origin;
        ~.* "";
    }
    server {
        location / {
            if ($http_origin !~* "^https://trusted\.example$") {
                return 403;
            }
            add_header Access-Control-Allow-Origin $cors always;
        }
    }
}

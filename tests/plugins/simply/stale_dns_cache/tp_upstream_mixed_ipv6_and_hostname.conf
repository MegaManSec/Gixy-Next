# Should TRIGGER: even though one server is a bracketed IPv6 literal, the
# second is a real hostname without `resolve`, which is the classic stale
# DNS cache scenario.
http {
  upstream mixed {
    server [::1]:8080;
    server backend.example.com:8080;
  }

  server {
    listen 80;
    location / {
      proxy_pass http://mixed;
    }
  }
}

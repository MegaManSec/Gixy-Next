# Should NOT trigger: every value is a unix socket, which needs no resolver.
http {
  map $host $php_sock {
    default            unix:/run/php/php8.2-fpm.sock;
    legacy.example.com unix:/run/php/php7.4-fpm.sock;
  }

  server {
    listen 80;
    location ~ \.php$ {
      fastcgi_pass $php_sock;
    }
  }
}

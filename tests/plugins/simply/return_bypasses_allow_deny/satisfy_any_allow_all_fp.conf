# Should NOT trigger: under satisfy any, `allow all` admits every client, so
# auth_basic never runs for this location and the return bypasses nothing.
server {
  satisfy any;
  allow 127.0.0.1;
  deny all;
  auth_basic "Restricted";
  auth_basic_user_file /etc/nginx/htpasswd;

  location = /health {
    allow all;
    return 200 "OK";
  }
}

# Should TRIGGER: under `satisfy any` the access module returns NGX_OK for
# every client, and ngx_http_core_access_phase() then skips the rest of the
# access phase, so auth_basic never runs. Verified against nginx: this
# returns 200 without credentials.
location /status {
    satisfy any;
    allow all;
    auth_basic "x";
    auth_basic_user_file /etc/nginx/htpasswd;
    stub_status;
}

# Should NOT trigger: the variable copies a map whose values are all IP literals, which nginx connects to without a lookup.
http {
  map $host $be_map {
    default 127.0.0.1:8081;
    b.example.com 127.0.0.2:8081;
  }

  server {
    listen 80;
    set $up $be_map;
    location / {
      proxy_pass http://$up;
    }
  }
}

# Should NOT trigger: the rewrite only produces URIs under /new/, which the
# internal location cannot match, so nothing reaches it before access.
# Verified against nginx: GET /old/x receives 403.
server {
  deny all;

  location /old/ {
    rewrite ^/old/(.*)$ /new/$1 last;
  }

  location /new/ {
    try_files $uri =404;
  }

  location = /private {
    internal;
    return 200 "secret";
  }
}

# False positive in the original PR: a duplicate `$N` reference anywhere
# in the replacement sets sc.dup_capture = 1, which forces nginx onto the
# non-buggy lengths != NULL length-calc path
# (ngx_http_script.c:486-488; ngx_http_rewrite_module.c:408). Not
# vulnerable, must not be flagged.
server {
    location / {
        rewrite ^/((.*))$ http://example.com/?p=$1&q=$2&r=$1 redirect;
    }
}

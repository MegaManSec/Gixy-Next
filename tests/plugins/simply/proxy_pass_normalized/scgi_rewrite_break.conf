location /app {
  rewrite ^/app(.*) /$1 break; # The replacement puts "/" before the capture, so the rewrite repeats the off-by-slash
  scgi_pass 127.0.0.1:4000; # scgi_params sends the rewritten $document_uri as DOCUMENT_URI
}

# Request received by nginx: /app../secret
# DOCUMENT_URI sent to the backend: /../secret

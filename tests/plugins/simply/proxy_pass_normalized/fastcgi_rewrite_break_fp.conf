location /api {
  rewrite ^/api(.*) /v1$1 break; # Neither the location nor the replacement before the capture ends in "/"
  fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
  fastcgi_pass 127.0.0.1:9000;
}

# Request received by nginx: /api../secret
# SCRIPT_FILENAME sent to the backend: /var/www/html/v1../secret

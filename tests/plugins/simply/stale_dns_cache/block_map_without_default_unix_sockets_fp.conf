# Should NOT trigger: an unmatched host gives an empty target, which fails without any DNS lookup.
http {
  map $host $php_sock {
    a.example.com unix:/run/php/a.sock;
    b.example.com unix:/run/php/b.sock;
  }

  server {
    listen 80;
    location ~ \.php$ {
      fastcgi_pass $php_sock;
    }
  }
}

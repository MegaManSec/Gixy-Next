location /app {
  set $upstream_app app;
  set $upstream_port 8080;
  rewrite /app(.*) $1 break; # Nothing before the capture: /app/x is sent as /x, so no slash is added or lost
  proxy_pass http://$upstream_app:$upstream_port;
}

# Request received by nginx: /app/x
# Request received by backend: /x

server {
    location /admin/ {
        satisfy any;
        allow 10.0.0.0/8;
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/htpasswd;
    }
    # The sibling's satisfy/auth must not leak here: this allow has no
    # deny and no auth fallback of its own.
    location /open/ {
        allow 10.0.0.0/8;
    }
}

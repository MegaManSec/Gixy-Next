# False positive guard: `if ($var)` is just a truthiness test on the
# variable — it's compiled to ngx_http_rewrite_variable lookup
# (rewrite_module.c:704), no complex_value_code is emitted, no overflow.
server {
    location / {
        rewrite ^(.*) /new?c=1;
        if ($1) {
            return 200 ok;
        }
    }
}

# Positive: the rewrite inside the `if` refills the captures, so `$2`
# is set while the args flag from the first rewrite is still active.
server {
    location /t/ {
        rewrite ^/t/(.*)$ /n/$1?c=1;
        if ($request_method = GET) {
            rewrite ^/n/([^/]*)/(.*)$ /m/x;
        }
        set $myvar $2;
    }
}

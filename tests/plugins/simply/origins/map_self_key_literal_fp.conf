http {
    map $origin_copy $cors {
        https://trusted.example $origin_copy;
        default "";
    }
    server {
        server_name a.example;
        set $origin_copy $http_origin;
        location / {
            add_header Access-Control-Allow-Origin $cors always;
        }
    }
    server {
        server_name b.example;
        set $origin_copy "";
        location / {
            return 200;
        }
    }
}

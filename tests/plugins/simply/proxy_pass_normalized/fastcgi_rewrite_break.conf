location /api {
  rewrite ^/api(.*) /$1 break; # The replacement puts "/" before the capture, so the rewrite repeats the off-by-slash
  fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; # $fastcgi_script_name is the rewritten $uri
  fastcgi_pass 127.0.0.1:9000;
}

# Request received by nginx: /api../secret
# SCRIPT_FILENAME sent to the backend: /var/www/html/../secret

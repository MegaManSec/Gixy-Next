server {
    listen 443 ssl;
    server_name api.example.com;

    location /api/ {
        set $jwt_token "";

        if ($http_authorization ~ "^Bearer (.+)$") {
            set $JWT_Token $1;
        }

        if ($jwt_token = "") {
            return 401 "Unauthorized";
        }

        proxy_pass http://api_backend;
        proxy_set_header X-JWT-Token $jwt_token;
        proxy_set_header Host $host;
    }
}

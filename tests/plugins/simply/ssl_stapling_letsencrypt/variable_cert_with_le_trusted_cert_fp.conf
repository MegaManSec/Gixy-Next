http {
    ssl_stapling on;
    ssl_trusted_certificate /etc/letsencrypt/live/example.com/chain.pem;

    server {
        listen 443 ssl;
        server_name example.com;

        ssl_certificate     /etc/ssl/certs/$ssl_server_name.pem;
        ssl_certificate_key /etc/ssl/private/$ssl_server_name.key;
    }
}

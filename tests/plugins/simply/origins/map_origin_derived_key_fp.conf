http {
    map $http_origin $cors_allowed {
        default 0;
        "~^https://(www\.)?trusted\.example$" 1;
    }
    map $cors_allowed $cors {
        1 $http_origin;
        default "";
    }
    server {
        location / {
            add_header Access-Control-Allow-Origin $cors always;
        }
    }
}

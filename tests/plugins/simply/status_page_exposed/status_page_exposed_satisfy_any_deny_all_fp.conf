# Should NOT trigger: this is the intended `trusted network OR password`
# shape. Clients outside the /8 are denied by the access module, which under
# `satisfy any` falls through to auth_basic rather than failing the request.
# Verified against nginx: 401 without credentials, 200 with them.
location /status {
    satisfy any;
    allow 10.0.0.0/8;
    deny all;
    auth_basic "x";
    auth_basic_user_file /etc/nginx/htpasswd;
    stub_status;
}

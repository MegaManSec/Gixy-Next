# Should TRIGGER: the location regex uses PCRE-only syntax Python cannot parse,
# so the rewrite is taken to reach it. Verified against nginx: GET / receives
# 200 "secret".
server {
  deny all;

  location / {
    rewrite ^ /private last;
  }

  location ~ "^/\Qpriv\E" {
    internal;
    return 200 "secret";
  }
}

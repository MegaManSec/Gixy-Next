# Should TRIGGER: the location declares no access rules of its own, so it
# inherits `satisfy any` and `allow all` from the server and the auth is
# bypassed just as if both were written here. Verified against nginx: this
# returns 200 without credentials.
http {
    server {
        satisfy any;
        allow all;
        auth_basic "x";
        auth_basic_user_file /etc/nginx/htpasswd;

        location /status {
            stub_status;
        }
    }
}

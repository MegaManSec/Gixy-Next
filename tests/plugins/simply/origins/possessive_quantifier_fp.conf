# Regression: a possessive quantifier is valid PCRE that nginx accepts, but
# the vendored sre_parse raises "multiple repeat" on it. The unguarded
# Regexp.generate() call aborted the whole audit; nothing analyzable can be
# said about the pattern, so the plugin must skip it silently.
if ($http_origin ~ "^https://(www\.)*+example\.com$") {
    add_header X-Frame-Options SAMEORIGIN;
}

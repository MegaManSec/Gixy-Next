location /api {
  rewrite ^/api(.*) /$1 break;
  fastcgi_param SCRIPT_FILENAME /srv/index.php; # No fastcgi_param carries the rewritten URI to the backend
  fastcgi_param QUERY_STRING $query_string;
  fastcgi_pass 127.0.0.1:9000;
}

# Request received by nginx: /api../x
# SCRIPT_FILENAME sent to the backend: /srv/index.php

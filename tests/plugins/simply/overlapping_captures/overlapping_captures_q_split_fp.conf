# False positive in the original PR: in a non-redirect rewrite, only
# captures *after* the first `?` enter args mode (e->is_args = 1). $1
# is written raw and only $2 is URI-escaped. A single escaped capture
# stays within the buggy escape(URI) budget, so this cannot overflow.
server {
    location / {
        rewrite ^/((.*))$ /foo/$1?$2 break;
    }
}

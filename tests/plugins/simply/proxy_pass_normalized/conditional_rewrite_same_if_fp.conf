location /b {
  if ($arg_x) {
    rewrite ^ $request_uri;              # URI := raw (unnormalized) request path
    rewrite ^/b/(.*)$ /$1 break;         # strip the prefix, stop rewriting
    proxy_pass http://127.0.0.1:8000/$1; # the rewrite runs whenever this proxy_pass runs
  }
}

# Request received by nginx: /b/%2F?x=1
# Request received by backend: /%2F?x=1

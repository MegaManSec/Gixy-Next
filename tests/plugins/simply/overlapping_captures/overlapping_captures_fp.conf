server {
    location / {
        # sibling captures — match ranges don't overlap, not vulnerable
        rewrite ^/([^/]+)/(.*)$ http://127.0.0.1:8080/?p=$1&r=$2;

        # nested but uses a nginx variable — different length-calc path
        rewrite ^/((.*))$ http://127.0.0.1:8080/?p=$1&h=$host;

        # nested but no `?` and no redirect — captures never URI-escaped
        rewrite ^/((.*))$ /internal/$1$2 last;

        # named captures — no $N references possible
        rewrite ^/(?<outer>(?<inner>.*))$ http://127.0.0.1:8080/?o=$outer&i=$inner;
    }
}

# Should NOT trigger: every map value is a variable set to an IP literal, which nginx connects to without a lookup.
http {
  map $arg_x $dest {
    default $target;
    beta    $target;
  }

  server {
    listen 80;
    set $target http://127.0.0.1:8081;
    location / {
      proxy_pass $dest;
    }
  }
}

# Should TRIGGER: `rewrite ... last` runs in the rewrite phase and sends the
# request into the internal location before any access phase, where the return
# responds first. Verified against nginx: GET / receives 200 "secret".
server {
  deny all;

  location / {
    rewrite ^ /private last;
  }

  location = /private {
    internal;
    return 200 "secret";
  }
}

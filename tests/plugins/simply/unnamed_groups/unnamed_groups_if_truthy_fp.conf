# False positive guard: nginx compiles the `if` tested operand to an
# indexed variable lookup (ngx_http_rewrite_variable), not a complex
# value, and there is no variable named "1" — nginx rejects this config
# with `[emerg] unknown "1" variable`.
server {
    location / {
        rewrite ^(.*) /new?c=1;
        if ($1) {
            return 200 ok;
        }
    }
}

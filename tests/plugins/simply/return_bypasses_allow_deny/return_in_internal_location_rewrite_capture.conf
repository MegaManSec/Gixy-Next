# Should TRIGGER: the replacement's literal prefix /priv plus a capture can
# produce /private. Verified against nginx: GET /go/ate receives 200 "secret".
server {
  deny all;

  location /go/ {
    rewrite ^/go/(.*)$ /priv$1 last;
  }

  location = /private {
    internal;
    return 200 "secret";
  }
}

http {
    server {
        server_name example.com;
        ssl_ecdh_curve X25519:prime256v1;
    }

    server {
        listen 443 ssl;
        server_name legacy.example.com;

        ssl_certificate     /etc/ssl/certs/legacy.example.com.pem;
        ssl_certificate_key /etc/ssl/private/legacy.example.com.key;
    }
}

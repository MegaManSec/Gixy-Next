name: Lint docs

on: [push, pull_request]

permissions:
  contents: read

jobs:
  yaml:
    name: yamllint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install yamllint
        run: python -m pip install yamllint
      - name: Run yamllint
        run: yamllint -c .yamllint.yml .github/workflows/ mkdocs.yml

  markdown:
    name: markdownlint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            docs/**/*.md
            README.md
            CONTRIBUTING.md

http {
    server {
        allow 10.0.0.0/8;
        deny all;
        location /status {
            stub_status;
            # The location's own access rules replace the inherited ones
            # wholesale (ngx_http_access_module), and without its own
            # "deny all" everyone outside 127.0.0.1 is allowed by default.
            allow 127.0.0.1;
        }
    }
}

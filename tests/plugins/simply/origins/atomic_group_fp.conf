# Regression: an atomic group is valid PCRE that nginx accepts, but the
# vendored sre_parse raises "unexpected end of pattern" on it. The negated
# operand takes the same analysis path as `~`, so both must skip cleanly.
if ($http_referer !~ "^https://(?>www\.)example\.com/") {
    add_header X-Frame-Options SAMEORIGIN;
}

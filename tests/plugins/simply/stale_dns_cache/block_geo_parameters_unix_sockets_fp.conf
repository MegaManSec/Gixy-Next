# Should NOT trigger: geo parameter lines configure the block, they are not values
http {
  geo $php_sock {
    default         unix:/run/php/php8.2-fpm.sock;
    proxy           192.168.1.0/24;
    proxy           2001:db8::/32;
    proxy_recursive;
    delete          127.0.0.1;
    10.0.0.0/8      unix:/run/php/php7.4-fpm.sock;
  }

  server {
    listen 80;
    location ~ \.php$ {
      fastcgi_pass $php_sock;
    }
  }
}

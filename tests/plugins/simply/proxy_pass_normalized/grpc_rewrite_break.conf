location /svc {
  rewrite ^/svc(.*) /$1 break; # The replacement puts "/" before the capture, so the rewrite repeats the off-by-slash
  grpc_pass grpc://127.0.0.1:50051; # The rewritten URI becomes the :path header
}

# Request received by nginx: /svc../secret
# :path sent to the backend: /../secret

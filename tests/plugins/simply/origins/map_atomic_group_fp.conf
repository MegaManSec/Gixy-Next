# Regression: map-based CORS allowlists reach the same analysis from
# post_audit(), so a PCRE-only regex key must be skipped there too rather
# than aborting the audit after every directive has already been visited.
http {
    map $http_origin $allow_origin {
        default "";
        ~^https://(?>www\.)example\.com$ $http_origin;
    }

    server {
        location / {
            add_header Access-Control-Allow-Origin $allow_origin;
        }
    }
}

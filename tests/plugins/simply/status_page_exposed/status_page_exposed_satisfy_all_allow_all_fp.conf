# Should NOT trigger: `satisfy all` is the default, and there the access
# module returning NGX_OK only advances to the next access-phase handler, so
# auth_basic still runs. Verified against nginx: 401 without credentials.
location /status {
    satisfy all;
    allow all;
    auth_basic "x";
    auth_basic_user_file /etc/nginx/htpasswd;
    stub_status;
}

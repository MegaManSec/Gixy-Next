# Should TRIGGER: this server does accept IPv6, so `allow ::/0` matches every
# client it can serve and `satisfy any` skips auth_basic. Verified against
# nginx: an IPv6 client gets 200 without credentials.
server {
    listen [::]:80;

    location /status {
        stub_status;
        satisfy any;
        allow ::/0;
        auth_basic "metrics";
        auth_basic_user_file /etc/nginx/htpasswd;
    }
}

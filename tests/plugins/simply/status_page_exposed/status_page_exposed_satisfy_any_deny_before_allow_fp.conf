# Should NOT trigger: `deny all` matches first, so no client reaches the
# `allow all` and everyone has to authenticate. Verified against nginx: 401
# without credentials, 200 with them.
location /status {
    satisfy any;
    deny all;
    allow all;
    auth_basic "x";
    auth_basic_user_file /etc/nginx/htpasswd;
    stub_status;
}

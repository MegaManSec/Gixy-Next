# Should NOT trigger: `return 403` gives the same response, error_page included,
# that auth_request gives when the auth endpoint answers 403.
server {
  error_page 403 /403.html;

  location /admin/ {
    auth_request /auth;
    if ($http_user_agent ~* bot) {
      return 403;
    }
    proxy_pass http://127.0.0.1:9000;
  }

  location = /auth {
    internal;
    proxy_pass http://127.0.0.1:9001;
  }
}

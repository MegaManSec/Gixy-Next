server {
    location / {
        # no ? in replacement — safe even with subsequent set
        rewrite ^/(.*)$ /profile/$1 last;
        set $x $1;

        # named capture — not a numeric $N reference
        rewrite ^/users/(?<id>[0-9]+)$ /profile.php?id=$id last;

        # ? present but no subsequent set
        rewrite ^/(.*)$ /static?v=2 last;
    }
}

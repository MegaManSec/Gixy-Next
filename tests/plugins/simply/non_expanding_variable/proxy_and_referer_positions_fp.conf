# Plain proxy_redirect and proxy_cookie_path values expand variables; only their ~ regex forms do not.
server {
    location / {
        proxy_redirect http://$host:8080/ /;
        proxy_cookie_path /$app/ /;
        proxy_hide_header X-Internal;
        valid_referers none blocked server_names *.example.com ~\.example\.;
        gzip_disable msie6 degradation;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        proxy_pass http://backend;
    }
}

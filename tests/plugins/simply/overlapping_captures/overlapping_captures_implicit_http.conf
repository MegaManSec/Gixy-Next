# Edge case: a `http://` prefix on the replacement triggers
# regex->redirect = 1 in nginx (ngx_http_rewrite_module.c:354-361) even
# without any explicit `redirect`/`permanent` flag and without a `?` in the
# replacement. Captures are URI-escaped on output and the buffer is sized
# from a single escape(URI) — overlapping captures overflow it.
server {
    location / {
        rewrite ^/((.*))$ http://127.0.0.1:8080/$1$2;
    }
}

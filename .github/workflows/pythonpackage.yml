name: Python tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  legacy:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned by digest, as the actions are: these images are frozen
          # (both Python versions are end-of-life), so the tags never move.
          - python-version: '3.6'
            image: python:3.6@sha256:f8652afaf88c25f0d22354d547d892591067aa4026a7fa9a6819df9f300af6fc
          - python-version: '3.7'
            image: python:3.7@sha256:eedf63967cdb57d8214db38ce21f105003ed4e4d0358f02bedc057341bcf92a0
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Install dependencies & test
        env:
          PYTHONWARNINGS: always
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt -r requirements.dev.txt
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          pytest tests -vv -W always -rA -n auto

  modern:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - python-version: '3.15-dev'
            experimental: true
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.dev.txt
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt -r requirements.dev.txt
      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Test with pytest
        env:
          PYTHONWARNINGS: always
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pytest tests -vv -W always -rA -n auto

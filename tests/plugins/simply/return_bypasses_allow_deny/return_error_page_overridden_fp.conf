# Should NOT trigger: the location declares its own error_page, so the server's
# `error_page 404` does not apply and `return 404` only produces the error page.
# Verified against nginx: a denied client receives the plain 404 page.
server {
  error_page 404 = @backend;

  location @backend {
    proxy_pass http://127.0.0.1:9000;
  }

  location /admin/ {
    allow 127.0.0.1;
    deny all;
    error_page 500 /500.html;
    return 404;
  }
}

# Should NOT trigger: `return 401` gives the same response, error_page included,
# that auth_basic gives a client without credentials.
server {
  error_page 401 /401.html;

  location /admin/ {
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/htpasswd;
    if ($http_x_blocked) {
      return 401;
    }
    proxy_pass http://127.0.0.1:9000;
  }
}

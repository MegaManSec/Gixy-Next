# Should NOT trigger: `mail` has no `default_server` listen parameter, so the
# recommendation cannot be followed. Verified against nginx: `listen 1110
# default_server` in `mail` is rejected with `invalid parameter
# "default_server"`, and the two servers below are rejected outright with
# `duplicate "0.0.0.0:1110" address and port pair`.
http {
    server {
        listen 80 default_server;
        server_name a.test;
    }
}

mail {
    server {
        listen 1110;
        protocol pop3;
    }

    server {
        listen 1110;
        protocol imap;
    }
}

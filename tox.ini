[tox]
envlist = py311, py312, py313, py314, py315, flake8
skip_missing_interpreters = True

[testenv]
deps =
    -rrequirements.txt
    -rrequirements.dev.txt
commands = pytest -v

[testenv:flake8]
deps =
    flake8
basepython = python3
commands =
    flake8 setup.py gixy

[flake8]
max_line_length = 120

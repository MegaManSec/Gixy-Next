# Should NOT trigger: the static localhost:8080 target creates a group resolved at startup, which the variable target reuses without a resolver
http {
  server {
    listen 80;
    location /var/ {
      set $backend localhost;
      proxy_pass http://$backend:8080;
    }
    location /static/ {
      proxy_pass http://localhost:8080;
    }
  }
}

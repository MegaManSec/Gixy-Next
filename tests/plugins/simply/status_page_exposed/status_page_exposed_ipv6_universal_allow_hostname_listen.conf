# Should TRIGGER: nginx binds every address the listen hostname resolves to,
# so whether this server answers over IPv6 is decided at startup and not by
# the config. The family is therefore unknown and `allow ::/0` is still
# treated as universal, rather than risk missing a real bypass.
server {
    listen localhost:80;

    location /status {
        stub_status;
        satisfy any;
        allow ::/0;
        auth_basic "metrics";
        auth_basic_user_file /etc/nginx/htpasswd;
    }
}

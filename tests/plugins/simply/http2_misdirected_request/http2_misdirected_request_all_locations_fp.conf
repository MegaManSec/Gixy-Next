http {
    server {
        listen 443 ssl default_server;
        http2 on;
        ssl_reject_handshake on;
        location / {
            return 421;
        }
        location /api {
            return 421;
            location /api/v2 {
                return 421;
            }
        }
        location ~ \.php$ {
            return 421;
        }
        location /private {
            internal;
            proxy_pass http://backend;
        }
        location @fallback {
            proxy_pass http://backend;
        }
    }
}

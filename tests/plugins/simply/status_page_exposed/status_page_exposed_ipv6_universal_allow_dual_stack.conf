# Should TRIGGER: with ipv6only=off the one IPv6 socket also serves IPv4
# clients, which reach the access module as IPv4-mapped addresses that the
# IPv6 rules match. Verified against nginx: both an IPv4 and an IPv6 client
# get 200 without credentials.
server {
    listen [::]:80 ipv6only=off;

    location /status {
        stub_status;
        satisfy any;
        allow ::/0;
        auth_basic "metrics";
        auth_basic_user_file /etc/nginx/htpasswd;
    }
}

http {
    map $http_origin $cors_ok {
        default 0;
        "~^https://(www\.)?trusted\.example$" 1;
    }
    server {
        location / {
            if ($cors_ok = 0) {
                return 403;
            }
            add_header Access-Control-Allow-Origin $http_origin always;
        }
    }
}

server {
    location ~ ^/old/(.+)$ {
        return 301 /new/$1;
    }
    # Internal redirects make "which regex ran" path-dependent, so the
    # whole-scope union spans every location of the server: the sibling's
    # capture keeps this reference plausible.
    location /api/ {
        return 301 /v2/$1;
    }
}

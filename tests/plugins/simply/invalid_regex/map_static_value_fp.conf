map $uri $dest {
    # Static and default entries run no regex of their own, so captures
    # from whichever regex matched earlier flow into their values; they
    # must not be validated against the key.
    default /fallback/$1;
    /exact  /static/$1;
}
server {
    location ~ ^/(.+)$ {
        return 301 $dest;
    }
}

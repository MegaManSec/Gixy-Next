http {
    geo $remote_addr $prefix {
        proxy_recursive;
        proxy 192.168.100.1;
        default "/default/";
        10.0.0.0/8 "/internal/";
        delete 10.0.0.0/8;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://$prefix$arg_host;
        }
    }
}
